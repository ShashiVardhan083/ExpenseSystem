trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '981fad73-abba-406e-98c1-5671d0e61128'
  imageRepository: 'expensesystem-api'
  containerRegistry: 'shashiexpenseregistry.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

stages:

# =========================
# CI STAGE
# =========================

- stage: Build
  displayName: Build and Push Docker Image

  jobs:
  - job: Build
    displayName: Build Application

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: 8.x

    - task: DotNetCoreCLI@2
      displayName: Restore NuGet Packages
      inputs:
        command: restore
        projects: '**/*.sln'

    - task: DotNetCoreCLI@2
      displayName: Build Solution
      inputs:
        command: build
        projects: '**/*.sln'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: Publish API Project
      inputs:
        command: publish
        publishWebProjects: false
        projects: '**/ExpenseSystem.API.csproj'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false

    - task: PublishBuildArtifacts@1
      displayName: Publish Build Artifacts
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          latest
          $(tag)

# =========================
# CD STAGE
# =========================

- stage: Deploy
  displayName: Deploy to Azure App Service

  dependsOn: Build

  jobs:
  - job: Deploy
    displayName: Deploy Container

    pool:
      vmImage: $(vmImageName)

    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy Docker Container to Azure Web App
      inputs:
        azureSubscription: 'azure-service-connection'
        appName: 'expensesystem-docker'
        containers: '$(containerRegistry)/$(imageRepository):latest'